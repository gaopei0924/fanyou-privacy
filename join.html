<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>加入我的飯友隊伍 · Join my Fanyou team</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0A0F1E; font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif; color:#F6F1E8; text-align:center; padding:24px; box-sizing:border-box; }
  .card { max-width: 420px; }
  .cloud { font-size: 56px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  p { line-height: 1.7; color: #A3ADC2; margin: 8px 0; }
  .code { display:inline-block; margin: 14px 0; padding: 12px 22px; border-radius: 14px; background: rgba(255,200,107,.12); border: 1px solid rgba(255,200,107,.4); color:#FFC86B; font-size: 2rem; font-weight: 800; letter-spacing: .25em; cursor: pointer; user-select: all; }
  .hint { font-size: .82rem; color: #6b7590; }
  .stores { display:flex; gap:10px; justify-content:center; margin: 18px 0 6px; flex-wrap: wrap; }
  .stores a, .stores span { display:inline-block; padding: 11px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; }
  .stores a { background: linear-gradient(135deg,#FFE3A8,#FFC86B 55%,#E8973C); color: #3a2a14; }
  .stores span { background: rgba(255,255,255,.08); color: #6b7590; }
  ol { text-align: left; color:#A3ADC2; line-height: 1.9; padding-left: 1.4em; }
  a.plain { color: #8A93AD; font-size: .8rem; }
</style>
</head>
<body>
<div class="card">
  <div class="cloud">🍚</div>
  <h1>有人邀請你加入<br/>他的「飯友」摘星隊伍！</h1>
  <p>飯友是把星級餐廳藏進迷霧的探索地圖 ——<br/>組隊後任何一人吃過，全隊的地圖都會亮。</p>

  <div id="codeWrap" style="display:none">
    <p>你的邀請碼（點一下複製）：</p>
    <div class="code" id="code" role="button" tabindex="0" aria-label="複製邀請碼"></div>
    <p class="hint" id="copied" style="visibility:hidden">已複製 ✓</p>
  </div>

  <!-- 上架後把兩個網址填進 STORES 即可,App 端不用再改 -->
  <div class="stores" id="stores"></div>

  <ol>
    <li>下載並打開「飯友」</li>
    <li>底部「隊伍」→ 登入</li>
    <li>「加入隊伍」輸入上面的邀請碼</li>
  </ol>
  <p class="hint">English: you've been invited to a Fanyou team. Install the app, sign in, open the Team tab and enter the invite code above.</p>
  <p><a class="plain" href="index.html">隱私權政策</a> · <a class="plain" href="terms.html">服務條款</a></p>
</div>
<script>
  // 商店網址:上架核准後填入,填了就會自動變成金色下載鈕
  var STORES = { ios: '', android: '' }

  var code = (new URLSearchParams(location.search).get('join') || '').trim().toUpperCase()
  // 邀請碼只有大寫英數 6 碼;不合格式就不顯示(避免把奇怪的參數印上畫面)
  if (/^[A-Z0-9]{4,8}$/.test(code)) {
    document.getElementById('codeWrap').style.display = ''
    var el = document.getElementById('code')
    el.textContent = code
    var copy = function () {
      var done = function () {
        var c = document.getElementById('copied')
        c.style.visibility = 'visible'
        setTimeout(function () { c.style.visibility = 'hidden' }, 1600)
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, done)
      else { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); done() }
    }
    el.addEventListener('click', copy)
    el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy() } })
  }

  var wrap = document.getElementById('stores')
  var mk = function (label, url) {
    if (url) { var a = document.createElement('a'); a.href = url; a.textContent = label; return a }
    var s = document.createElement('span'); s.textContent = label + '(即將上架)'; return s
  }
  wrap.appendChild(mk('App Store ', STORES.ios))
  wrap.appendChild(mk('Google Play ', STORES.android))
</script>
</body>
</html>
